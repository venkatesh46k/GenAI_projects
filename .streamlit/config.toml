[theme]
base = "light"
primaryColor = "#0b6bcb"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"

[server]
headless = true
# The file watcher walks every imported module, including transformers' lazy submodules, and logs a traceback for each
# one that needs a missing optional dependency. Set to "auto" while developing the UI if you want hot reload.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
